name: Version

# Opens and maintains a "Version Packages" PR from the changesets on main.
#
# This workflow deliberately does NOT publish. changesets/action spawns the
# publish command as a child process and does not pass the OIDC request token
# through to it, so `npm publish` fails ENEEDAUTH (npm/cli#8976). Publishing
# stays in publish.yml. Merging the Version Packages PR edits package.json,
# which is what publish.yml triggers on. See RELEASING.md.

on:
  push:
    branches: [main]

concurrency:
  group: version-packages
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: changesets/action@v1
        with:
          version: npx changeset version
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
